<!doctype html><!-- webkit-test-runner [ IPCTestingAPIEnabled=true ] -->
<title>Test that a Swift stream receiver handles messages on its work queue.</title>
<script src="../resources/testharness.js"></script>
<script src="../resources/testharnessreport.js"></script>
<body>
<script>
async function runTest() {
    const defaultTimeout = 1000;
    const bufferSizeLog2 = 9;
    const streamTesterID = 447;

    for (const processTarget of IPC.processTargets) {
        const [streamConnection, serverConnectionHandle] = IPC.createStreamClientConnection(bufferSizeLog2, defaultTimeout);
        streamConnection.open();
        IPC.sendMessage(processTarget, 0, IPC.messages.IPCTester_CreateStreamTester.name, [
            { type: 'uint64_t', value: streamTesterID },
            { type: 'StreamServerConnectionHandle', value: serverConnectionHandle },
        ]);
        try {
            // Few enough that the out-of-stream markers don't wrap the stream buffer.
            let expectedDigest = 0;
            for (let value = 1; value <= 10; ++value) {
                streamConnection.sendMessage(streamTesterID, IPC.messages.IPCSwiftStreamTester_Record.name, [{ type: 'uint32_t', value }]);
                expectedDigest = (Math.imul(expectedDigest, 31) + value) >>> 0;
            }
            for (const text of ['ascii', 'caf\u00e9', '\u65e5\u672c\u8a9e \u263a']) {
                streamConnection.sendMessage(streamTesterID, IPC.messages.IPCSwiftStreamTester_RecordTextSwift.name, [{ type: 'String', value: text }]);
                for (const byte of new TextEncoder().encode(text))
                    expectedDigest = (Math.imul(expectedDigest, 31) + byte) >>> 0;
                expectedDigest = Math.imul(expectedDigest, 31) >>> 0;
            }
            const digestReply = streamConnection.sendSyncMessage(streamTesterID, IPC.messages.IPCSwiftStreamTester_TakeRecordedDigest.name, []);
            assert_equals(digestReply.arguments[0].value, expectedDigest, `TakeRecordedDigest for ${processTarget}`);

            const repeatReply = streamConnection.sendSyncMessage(streamTesterID, IPC.messages.IPCSwiftStreamTester_RepeatTextSwift.name, [{ type: 'String', value: 'ab' }, { type: 'uint32_t', value: 3 }]);
            assert_equals(repeatReply.arguments[0].value, 'ababab', `RepeatTextSwift for ${processTarget}`);

            // Lent bytes in the stream buffer, and out of stream: more than its 512 bytes.
            for (const size of [0, 16, 300, 2000]) {
                const bytes = Array.from({ length: size }, (_, index) => (index * 7 + size) & 0xFF);
                const salt = 5 + size;
                const tail = 0xFFFFFFF0 - size;
                let digest = salt;
                const mix = value => { digest = (Math.imul(digest, 31) + value) >>> 0; };
                for (let copy = 0; copy < 2; ++copy) {
                    mix(size);
                    bytes.forEach(mix);
                }
                mix(tail);
                const reply = streamConnection.sendSyncMessage(streamTesterID, IPC.messages.IPCSwiftStreamTester_DigestLentBytesSwift.name, [
                    { type: 'uint32_t', value: salt },
                    { type: 'Vector', value: bytes.map(value => [{ type: 'uint8_t', value }]) },
                    { type: 'uint32_t', value: tail },
                ]);
                assert_equals(reply.arguments[0].value, digest, `DigestLentBytesSwift of ${size} bytes for ${processTarget}`);
            }

            let sumReply;
            const asyncReplyID = streamConnection.sendWithAsyncReply(streamTesterID, IPC.messages.IPCSwiftStreamTester_Add.name, [{ type: 'uint32_t', value: 40 }, { type: 'uint32_t', value: 2 }], message => {
                sumReply = message;
            });
            if (!sumReply)
                streamConnection.waitForAsyncReplyAndDispatchImmediately(asyncReplyID, IPC.messages.IPCSwiftStreamTester_AddReply.name);
            assert_equals(sumReply.arguments[0].value, 42, `Add for ${processTarget}`);

            // Swift-typed asynchronous replies, sent at once, later, and dropped for the default reply.
            const asyncCases = [
                ['AddSwift', null, 42],
                ['DeferAddSwift', 1, 42],
                ['DeferAddSwift', 0, 0],
            ];
            for (const [name, sendDeferredReply, expected] of asyncCases) {
                let reply;
                const replyID = streamConnection.sendWithAsyncReply(streamTesterID, IPC.messages[`IPCSwiftStreamTester_${name}`].name, [{ type: 'uint32_t', value: 40 }, { type: 'uint32_t', value: 2 }], message => {
                    reply = message;
                });
                if (sendDeferredReply !== null)
                    streamConnection.sendMessage(streamTesterID, IPC.messages.IPCSwiftStreamTester_CompleteDeferredAddSwift.name, [{ type: 'bool', value: sendDeferredReply }]);
                if (!reply)
                    streamConnection.waitForAsyncReplyAndDispatchImmediately(replyID, IPC.messages[`IPCSwiftStreamTester_${name}Reply`].name);
                assert_equals(reply.arguments[0].value, expected, `${name} ${sendDeferredReply} for ${processTarget}`);
            }

            assert_throws_js(TypeError, () => {
                streamConnection.sendSyncMessage(streamTesterID, IPC.messages.IPCSwiftStreamTester_RepeatTextSwift.name, [{ type: 'uint32_t', value: 1 }, { type: 'uint8_t', value: 2 }]);
            }, `malformed RepeatTextSwift for ${processTarget}`);
        } finally {
            IPC.sendSyncMessage(processTarget, 0, IPC.messages.IPCTester_ReleaseStreamTester.name, defaultTimeout, [{ type: 'uint64_t', value: streamTesterID }]);
            streamConnection.invalidate();
        }
    }
    done();
}

setup({ single_test: true });
// The receiver only exists where WebKit's IPC testing code is built with Swift.
if (window.IPC && IPC.messages.IPCSwiftStreamTester_Record)
    runTest();
else
    done();
</script>
</body>
