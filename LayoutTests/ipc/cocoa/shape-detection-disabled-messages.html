<!DOCTYPE html><!-- webkit-test-runner [ IPCTestingAPIEnabled=true ShapeDetection=false ] -->
<p>This test passes if the GPU process's rendering backend handles no shape detection message while shape detection is disabled, without crashing.</p>
<pre id="log"></pre>
<script>
testRunner?.dumpAsText();
testRunner?.waitUntilDone();

const log = s => document.getElementById("log").textContent += s + "\n";
// Identifiers no earlier run in this process has used, since the GPU process keeps a backend's identifier after it goes.
let nextID = Date.now() * 1000;
const genID = () => nextID++;

// The reply, or why there is none, within a bounded wait: short where no reply is expected, long where one is, since a
// new rendering backend's first reply can be slow under load.
function withTimeout(send, timeout = 200) {
    return new Promise(resolve => {
        const timer = setTimeout(() => resolve("no reply"), timeout);
        try {
            send(reply => {
                clearTimeout(timer);
                resolve("reply " + JSON.stringify(reply, (key, value) => typeof value == "bigint" ? value.toString() : value));
            });
        } catch (e) {
            clearTimeout(timer);
            resolve("not sent: " + e.name);
        }
    });
}

// Each case on a rendering backend of its own, since an invalid message can stop its stream connection.
async function runCase(CoreIPC, name, expected, body) {
    const connection = CoreIPC.newStreamConnection();
    const backendID = genID();
    CoreIPC.GPU.GPUConnectionToWebProcess.CreateRenderingBackend(0, { renderingBackendIdentifier: backendID, connectionHandle: connection });
    const backend = connection.newInterface('RemoteRenderingBackend', backendID);
    const result = await body({ connection, backend });
    log((expected(result) ? "PASS: " : "FAIL: ") + name + (expected(result) ? "" : " gave " + result));
    connection.connection.invalidate();
}

const caseNames = ["supported formats", "Barcode created", "Face created", "Text created", "backend afterwards"];

async function run() {
    const { CoreIPC } = await import('../coreipc.js');
    const unknownImage = { renderingResourceIdentifier: 987654321 };
    const noReply = result => result == "no reply";
    await runCase(CoreIPC, "supported formats", noReply, ({ backend }) => withTimeout(reply => backend.SupportedBarcodeDetectorBarcodeFormats({}, reply)));
    for (const [kind, create, options] of [["Barcode", "CreateBarcodeDetector", { barcodeDetectorOptions: { formats: [0] } }], ["Face", "CreateFaceDetector", { faceDetectorOptions: { maxDetectedFaces: 1, fastMode: false } }], ["Text", "CreateTextDetector", { }]]) {
        await runCase(CoreIPC, `${kind} created`, noReply, ({ connection, backend }) => {
            const id = genID();
            backend[create]({ identifier: id, ...options });
            return withTimeout(reply => connection.newInterface(`Remote${kind}Detector`, id).Detect(unknownImage, reply));
        });
    }
    await runCase(CoreIPC, "backend afterwards", result => result.startsWith("reply"), ({ backend }) => withTimeout(reply => backend.GetImageBufferResourceLimitsForTesting({}, reply), 10000));
}

window.onload = async () => {
    if (!window.IPC) {
        for (const caseName of caseNames)
            log("PASS: " + caseName);
        return testRunner?.notifyDone();
    }
    try {
        await run();
    } catch (e) {
        log('FAIL: ' + e);
    }
    testRunner?.notifyDone();
};
</script>
