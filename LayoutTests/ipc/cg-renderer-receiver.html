<!DOCTYPE html><!-- webkit-test-runner [ IPCTestingAPIEnabled=true ] -->
<p>This test passes if an image buffer draws the same through the GPU process's Swift CG renderer receiver (RemoteCGRenderer) directly as through a display list that RemoteCGRenderer's recorder records, which the image buffer replays.</p>
<pre id="log"></pre>
<script>
testRunner?.dumpAsText();
testRunner?.waitUntilDone();

const log = s => document.getElementById("log").textContent += s + "\n";
const modes = [["unaccelerated", 0], ["accelerated", 1]];
const size = 48;
let nextID = Math.floor(Math.random() * 0x1000000) + 1;
const genID = () => nextID++;

const rect = (x, y, width, height) => ({ location: { x, y }, size: { width, height } });
const transform = (a, b, c, d, e, f) => ({ span: [a, b, c, d, e, f] });

// One scene as [message, arguments] pairs, which leaves the transform relative to the context's, as a display list's are.
function scene(tileImageBufferIdentifier) {
    const pattern = { repeatX: true, repeatY: true, patternSpaceTransform: transform(1, 0, 0, 1, 0, 0) };
    return [
        ["Restore", {}],
        ["SetFillPackedColor", 0xFF2020FF],
        ["FillRect", { rect: rect(0, 0, size, size), requiresClipToRect: 0 }],
        ["Save", {}],
        ["Translate", { x: 3, y: 4 }],
        ["Scale", { scale: { width: 1.25, height: 0.75 } }],
        ["Clip", { rect: rect(1, 1, 30, 40) }],
        ["SetAlpha", { alpha: 0.75 }],
        ["SetFillPackedColor", 0x2040E0FF],
        ["FillRect", { rect: rect(2, 2, 20, 12), requiresClipToRect: 1 }],
        ["SetCompositeMode", { mode: { operation: 2, blendMode: 1 } }],
        ["FillEllipse", { rect: rect(8, 10, 18, 22) }],
        ["SetStrokePackedColorAndThickness", [0x20C040C0, 2.5]],
        ["SetLineCap", { lineCap: 1 }],
        ["SetLineJoin", { lineJoin: 2 }],
        ["SetMiterLimit", { limit: 3 }],
        ["StrokeRect", { rect: rect(4, 20, 14, 9), lineWidth: 1.5 }],
        ["StrokeEllipse", { rect: rect(14, 4, 12, 16) }],
        ["DrawLine", { point1: { x: 1, y: 1 }, point2: { x: 30, y: 26 } }],
        ["DrawRect", { rect: rect(20, 24, 10, 8), borderThickness: 1 }],
        ["Restore", {}],
        ["SetStrokeThickness", { thickness: 3 }],
        ["SetStrokePackedColor", 0xF0D000FF],
        ["Rotate", { angle: 0.2 }],
        ["ConcatCTM", { ctm: transform(1, 0.1, 0, 1, 2, -1) }],
        ["StrokeRect", { rect: rect(26, 6, 14, 14), lineWidth: 2 }],
        ["ClipOut", { rect: rect(36, 36, 6, 6) }],
        ["ClearRect", { rect: rect(32, 30, 14, 14) }],
        ["ResetClip", {}],
        ["SetShouldAntialias", { shouldAntialias: false }],
        ["SetFillRule", { rule: 1 }],
        ["SetFillPackedColor", 0x00A0A0FF],
        ["FillEllipse", { rect: rect(30, 2, 15, 11) }],
        ["SetShouldAntialias", { shouldAntialias: true }],
        ["SetImageInterpolationQuality", { quality: 1 }],
        ["SetStrokeStyle", { style: 1 }],
        ["DrawRect", { rect: rect(2, 34, 12, 10), borderThickness: 2 }],
        ["SetFillPatternImageBuffer", { imageBufferIdentifier: tileImageBufferIdentifier, pattern }],
        ["FillEllipse", { rect: rect(16, 34, 12, 12) }],
        ["FillRect", { rect: rect(40, 20, 6, 8), requiresClipToRect: 0 }],
        ["SetStrokePatternImageBuffer", { imageBufferIdentifier: tileImageBufferIdentifier, pattern }],
        ["StrokeEllipse", { rect: rect(28, 32, 10, 12) }],
        ["ApplyFillPattern", {}],
        ["ApplyStrokePattern", {}],
        ["SetShouldSmoothFonts", { shouldSmooth: false }],
        ["SetShouldSubpixelQuantizeFonts", { shouldQuantize: false }],
    ];
}

function send(context, [name, args]) {
    if (name.endsWith("PackedColor"))
        return context[name]({ color: args });
    if (name == "SetStrokePackedColorAndThickness")
        return context[name]({ color: args[0], thickness: args[1] });
    return context[name](args);
}

async function run() {
    const { CoreIPC } = await import('./coreipc.js');
    CoreIPC.typeInfo['WebCore::PlatformColorSpace'] = [
        { type: 'std::optional<WebKit::CoreIPCCGColorSpace>', name: 'alias' }
    ];
    const CS = {};
    for (const e of IPC.serializedEnumInfo['WebCore::ColorSpaceName'].valueMap)
        CS[e.name] = e.value;
    const sRGB = { serializableColorSpace: { alias: { optionalValue: {
        m_cgColorSpace: { alias: { variantType: 'WebCore::ColorSpaceName', variant: CS.SRGB } } } } } };

    for (const [modeName, renderingMode] of modes) {
        const connection = CoreIPC.newStreamConnection();
        const backendID = genID();
        CoreIPC.GPU.GPUConnectionToWebProcess.CreateRenderingBackend(0, { renderingBackendIdentifier: backendID, connectionHandle: connection });
        const backend = connection.newInterface('RemoteRenderingBackend', backendID);
        const createBuffer = (width, height) => {
            const identifier = genID(), contextIdentifier = genID();
            backend.CreateImageBuffer({
                logicalSize: { width, height }, renderingMode, renderingPurpose: 0, resolutionScale: 1.0, colorSpace: sRGB,
                bufferFormat: { pixelFormat: 3, useLosslessCompression: 0 }, identifier, contextIdentifier,
            });
            return { identifier, contextIdentifier };
        };
        const readBack = identifier => {
            const imageBuffer = connection.newInterface('RemoteImageBuffer', identifier);
            imageBuffer.FlushContext({});
            const bytes = size * size * 4;
            const memory = IPC.createSharedMemory(bytes);
            memory.writeBytes(new Uint8Array(bytes).fill(0xAA));
            imageBuffer.GetPixelBufferWithNewMemory({
                handle: { protection: 'ReadWrite', handle: memory },
                outputFormat: { alphaFormat: 0, pixelFormat: 1, colorSpace: sRGB },
                srcPoint: { x: 0, y: 0 }, srcSize: { width: size, height: size },
            });
            return new Uint8Array(memory.readBytes(0, bytes));
        };

        const tile = createBuffer(4, 4);
        const tileContext = connection.newInterface('RemoteCGRenderer', tile.contextIdentifier);
        tileContext.SetFillPackedColor({ color: 0x8000FFFF });
        tileContext.FillRect({ rect: rect(0, 0, 2, 4), requiresClipToRect: 0 });

        const pixels = [];
        for (const replaysDisplayList of [false, true]) {
            const buffer = createBuffer(size, size);
            const context = connection.newInterface('RemoteCGRenderer', buffer.contextIdentifier);
            if (!replaysDisplayList) {
                for (const step of scene(tile.identifier))
                    send(context, step);
            } else {
                const recorderIdentifier = genID(), displayListIdentifier = genID();
                backend.CreateDisplayListRecorder({ identifier: recorderIdentifier });
                const recorder = connection.newInterface('RemoteCGRenderer', recorderIdentifier);
                for (const step of scene(tile.identifier))
                    send(recorder, step);
                backend.SinkDisplayListRecorderIntoDisplayList({ identifier: recorderIdentifier, displayListIdentifier });
                context.DrawDisplayList({ identifier: displayListIdentifier });
            }
            pixels.push(readBack(buffer.identifier));
        }
        connection.connection.invalidate();

        let differences = 0;
        for (let i = 0; i < pixels[0].length; ++i)
            differences += pixels[0][i] != pixels[1][i];
        const drawn = pixels[1].some((value, i) => i % 4 == 3 && value != 0) && !pixels[1].every(value => value == 0xAA);
        log((differences || !drawn ? 'FAIL' : 'PASS') + `: ${modeName} ` + (differences ? `${differences} bytes differ` : drawn ? 'same pixels' : 'nothing drawn'));
    }
}

window.onload = async () => {
    if (!window.IPC) {
        for (const [modeName] of modes)
            log(`PASS: ${modeName} same pixels`);
        return testRunner?.notifyDone();
    }
    try {
        await run();
    } catch (e) {
        log('FAIL: ' + e);
    }
    testRunner?.notifyDone();
};
</script>
