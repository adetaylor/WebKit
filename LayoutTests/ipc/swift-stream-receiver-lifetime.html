<!doctype html><!-- webkit-test-runner [ IPCTestingAPIEnabled=true ] -->
<title>Test that releasing a stream tester destroys its Swift stream receiver.</title>
<script src="../resources/testharness.js"></script>
<script src="../resources/testharnessreport.js"></script>
<body>
<script>
function runTest() {
    const defaultTimeout = 1000;
    const bufferSizeLog2 = 9;
    const streamTesterID = 448;

    for (const processTarget of IPC.processTargets) {
        const swiftStreamTesterCount = () => IPC.sendSyncMessage(processTarget, 0, IPC.messages.IPCTester_SwiftStreamTesterCount.name, defaultTimeout, []).arguments[0].value;
        const countBefore = swiftStreamTesterCount();

        const [streamConnection, serverConnectionHandle] = IPC.createStreamClientConnection(bufferSizeLog2, defaultTimeout);
        streamConnection.open();
        IPC.sendMessage(processTarget, 0, IPC.messages.IPCTester_CreateStreamTester.name, [
            { type: 'uint64_t', value: streamTesterID },
            { type: 'StreamServerConnectionHandle', value: serverConnectionHandle },
        ]);
        // Its Swift receiver has handled a message once this replies.
        streamConnection.sendSyncMessage(streamTesterID, IPC.messages.IPCSwiftStreamTester_TakeRecordedDigestSwift.name, []);
        assert_equals(swiftStreamTesterCount(), countBefore + 1, `Swift stream testers alive after creating one in ${processTarget}`);

        IPC.sendSyncMessage(processTarget, 0, IPC.messages.IPCTester_ReleaseStreamTester.name, defaultTimeout, [{ type: 'uint64_t', value: streamTesterID }]);
        streamConnection.invalidate();
        assert_equals(swiftStreamTesterCount(), countBefore, `Swift stream testers alive after releasing it in ${processTarget}`);
    }
    done();
}

setup({ single_test: true });
// The receiver only exists where WebKit's IPC testing code is built with Swift.
if (window.IPC && IPC.messages.IPCTester_SwiftStreamTesterCount)
    runTest();
else
    done();
</script>
</body>
