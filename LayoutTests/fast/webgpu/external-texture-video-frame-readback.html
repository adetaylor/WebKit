<!DOCTYPE html>
<html>
<body>
<pre id="result"></pre>
<script>
if (window.testRunner) { testRunner.waitUntilDone(); testRunner.dumpAsText(); }

// Each frame of each iframe imports a WebCodecs VideoFrame of a new colour as external textures several times, and
// samples one of them in a render pass whose result is read back. Every iframe has its own GPU, so the GPU process
// tears one down before the next starts.
const iframeCount = 4;
const framesPerIframe = 24;
const importsPerFrame = 8;

function log(message)
{
    document.getElementById('result').textContent += message + '\n';
}

async function sampleFrames(gpu)
{
    const adapter = await gpu.requestAdapter();
    const device = await adapter.requestDevice();
    const canvas = new OffscreenCanvas(16, 16);
    const context = canvas.getContext('2d');
    const module = device.createShaderModule({ code: `
        @group(0) @binding(0) var frame: texture_external;
        @group(0) @binding(1) var frameSampler: sampler;
        @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
            let positions = array(vec2f(-1, -1), vec2f(3, -1), vec2f(-1, 3));
            return vec4f(positions[i], 0, 1);
        }
        @fragment fn fs() -> @location(0) vec4f {
            return textureSampleBaseClampToEdge(frame, frameSampler, vec2f(0.5, 0.5));
        }` });
    const layout = device.createBindGroupLayout({ entries: [
        { binding: 0, visibility: GPUShaderStage.FRAGMENT, externalTexture: { } },
        { binding: 1, visibility: GPUShaderStage.FRAGMENT, sampler: { } },
    ] });
    const pipeline = device.createRenderPipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [layout] }),
        vertex: { module },
        fragment: { module, targets: [{ format: 'rgba8unorm' }] },
    });
    const frameSampler = device.createSampler();
    const target = device.createTexture({ size: [1, 1], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    const readback = device.createBuffer({ size: 256, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });

    let failures = 0;
    for (let i = 0; i < framesPerIframe; ++i) {
        const red = 40 + i * 8;
        context.fillStyle = `rgb(${red}, 80, 120)`;
        context.fillRect(0, 0, 16, 16);
        const frame = new VideoFrame(canvas, { timestamp: i });
        let group;
        for (let j = 0; j < importsPerFrame; ++j)
            group = device.createBindGroup({ layout, entries: [{ binding: 0, resource: device.importExternalTexture({ source: frame }) }, { binding: 1, resource: frameSampler }] });
        const encoder = device.createCommandEncoder();
        const pass = encoder.beginRenderPass({ colorAttachments: [{ view: target.createView(), loadOp: 'clear', clearValue: [0, 0, 0, 0], storeOp: 'store' }] });
        pass.setPipeline(pipeline);
        pass.setBindGroup(0, group);
        pass.draw(3);
        pass.end();
        encoder.copyTextureToBuffer({ texture: target }, { buffer: readback, bytesPerRow: 256 }, [1, 1]);
        device.queue.submit([encoder.finish()]);
        frame.close();
        await readback.mapAsync(GPUMapMode.READ);
        const texel = new Uint8Array(readback.getMappedRange()).slice(0, 4);
        readback.unmap();
        if (Math.abs(texel[0] - red) > 3 || Math.abs(texel[1] - 80) > 3 || Math.abs(texel[2] - 120) > 3 || texel[3] != 255) {
            if (!failures)
                log(`FAIL frame ${i}: expected ${red},80,120,255, got ${Array.from(texel).join(',')}`);
            ++failures;
        }
    }
    device.destroy();
    return failures;
}

async function run()
{
    log('Tests that external textures imported from WebCodecs VideoFrames sample their frames, as iframes with their own GPU come and go.\n');
    let failures = 0;
    for (let i = 0; i < iframeCount; ++i) {
        const iframe = document.createElement('iframe');
        document.body.appendChild(iframe);
        failures += await sampleFrames(iframe.contentWindow.navigator.gpu);
        iframe.remove();
    }
    log(failures ? `FAIL ${failures} of ${iframeCount * framesPerIframe} frames sampled the wrong colour` : `PASS all ${iframeCount * framesPerIframe} frames sampled their colour`);
}

run().catch(error => log('FAIL ' + error)).finally(() => { if (window.testRunner) testRunner.notifyDone(); });
</script>
</body>
</html>
